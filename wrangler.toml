name = "subdomain-hub"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# 前端产物：Vite 构建出的 React SPA（npm run build）
[assets]
directory = "dist/client"
binding = "ASSETS"
# 由 Worker 先处理（whois 子域的服务端重定向需要），处理完再回落到静态资源
run_worker_first = true

# Workers AI：后台「AI 自动审核 → 审核服务」选「Workers AI」时走这个绑定。
# 不需要任何 API Key / 接口地址，直接 env.AI.run(模型, { messages })。
# 若不想用 Workers AI、只用自定义 OpenAI 兼容网关，可删掉这两行，
# 后台仍会显示该选项但诊断会提示「绑定缺失」。
[ai]
binding = "AI"

# 定时审核：每小时整点把全部待审（pending）域名重新交给 AI 判定一次。
# 新申请提交时也会立即触发同一套批处理，两条路径用数据库领取锁互斥。
# 只处理 AI 名单内的根域名；失败会累计次数，超过 5 次转人工，避免无限重试。
[triggers]
crons = ["0 * * * *"]

# R2 对象存储：用于用户上传自定义头像（可选）
# 创建：npx wrangler r2 bucket create meoy-avatars
# 若不使用自定义头像上传，可整段删除（上传接口会自动禁用）
[[d1_databases]]
binding = "DB"
database_name = "subdomain-hub-db"
# 先执行 `npx wrangler d1 create subdomain-hub-db`，把返回的 id 填到这里（32 位十六进制）
database_id = "00000000000000000000000000000000"

[vars]
# 根域名（用户申请到的子域名都挂在这个域下）
ROOT_DOMAIN = "meoy.top"
# 多根域名（可选）：不填则只用上面的 ROOT_DOMAIN
# 允许申请的根域名列表，逗号分隔
ROOT_DOMAINS = ""
# 每个根域名对应的 Cloudflare Zone ID，格式 "域名:ZoneID" 逗号分隔
# 例：ROOT_DOMAINS = "meoy.top,foo.com"
#     CF_ZONE_IDS  = "meoy.top:aaa...,foo.com:bbb..."
CF_ZONE_IDS = ""
# 每个用户默认可持有的子域名数量
DEFAULT_QUOTA = "5"
# 是否开放注册（"0" = 关闭注册，仅管理员可开号）
ALLOW_SIGNUP = "1"
# 新申请的子域名是否需要管理员审核（"1" = 需要审核）
REQUIRE_APPROVAL = "1"
# 保留子域（逗号分隔，禁止申请；管理员仍可申请）
# 注意：whois 用于 WHOIS 查询页、bbs/forum 等留给站点自身功能，务必保留
RESERVED_LABELS = "www,ns1,ns2,ns3,ns4,mail,admin,api,cdn,ftp,smtp,pop,imap,mx,test,blog,shop,app,dns,dns1,dns2,root,support,help,docs,status,panel,cloud,dev,git,ssh,mysql,db,web,forum,bbs,home,search,whois,dnshe,anyns,ns,cdn1,cname,static,assets,img,image,img1,cdn2,img2"
# 调试用：置为 "1" 时不真实调用 Cloudflare API，改为内存模拟（方便本地跑通流程）
CF_MOCK = "0"
# R2 公开访问域名（留空则用默认 /api/avatar/<key> 代理读取）
# 建议在 R2 桶设置里绑定自定义域（如 img.meoy.top），填到这里可直接外链，省 Worker 流量
R2_PUBLIC_URL = ""
# ── AI 自动审核（Agnes AI 等 OpenAI 兼容网关）──
# 密钥请用 Secret 注入，绝对不要写进本文件（本文件会随代码库公开）：
#   npx wrangler secret put AI_API_KEY
# 也可以在「后台 → 站点设置 → AI 自动审核」里填写（只存数据库，后台只回掩码）。
# 可选覆盖（Vars 或 Secret）：AI_API_URL、AI_MODEL、AI_REVIEW_ROOTS、DNS_UNLIMITED_ROOTS
# 头像上传大小上限（KB）
AVATAR_MAX_KB = "2048"

# 以下敏感值用 secret 写入，不要写在这里：
#   npx wrangler secret put CF_API_TOKEN
#   npx wrangler secret put CF_ZONE_ID
