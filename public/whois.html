<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WHOIS 查询 · Meoy</title>
<link rel="stylesheet" href="/css/style.css">
<script>
  /* WHOIS 页是免登录、免跳转的公开页。
     本页不做任何自动跳转（除非用户主动点「申请这个域名」），
     这里只清理历史遗留的跳转标记，避免旧版本留下的状态把本页踢走。 */
  (function () {
    // 声明为公开页：接口返回 401 时不跳转登录页（本页免登录）
    window.MEOY_PUBLIC_PAGE = true;
    try {
      sessionStorage.removeItem('meoy_whois_rd');
      sessionStorage.removeItem('meoy_whois_n');
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="bg"></div>
<nav class="nav" id="nav"></nav>

<div class="wrap" style="max-width:760px">
  <h1>WHOIS 查询</h1>
  <div class="sub" id="rootTip">查询某个二级子域名的注册状态</div>
  <div class="hint" id="hostTip" style="margin:0 0 12px"></div>

  <div class="card">
    <div class="row" style="align-items:flex-end;flex-wrap:nowrap">
      <div style="flex:1;min-width:180px">
        <label>域名</label>
        <div class="row" style="gap:0;flex-wrap:nowrap">
          <input id="q" placeholder="me" style="border-radius:var(--radius-s) 0 0 var(--radius-s);border-right:none" autocomplete="off">
          <span class="mono" id="rootSuffix" style="padding:0 11px;background:rgba(0,229,255,.08);border:1px solid var(--line);border-radius:0 var(--radius-s) var(--radius-s) 0;display:flex;align-items:center;white-space:nowrap;color:var(--c1);font-size:12px">.meoy.top</span>
        </div>
      </div>
      <button class="btn primary" id="btnQuery" style="flex:0 0 auto">查询</button>
    </div>
    <div class="hint" style="margin-top:6px">只写前缀（如 <span class="mono">me</span>）或完整域名（如 <span class="mono">me.meoy.top</span>）都可以。</div>
  </div>

  <div class="card" id="result" style="display:none"></div>

  <div class="card flat">
    <h3>说明</h3>
    <div style="color:var(--text-2);font-size:12.5px;line-height:1.9">
      · <b>可注册</b>：名称未被占用，可立即申请。<br>
      · <b>审核中</b>：已有人提交申请，等待管理员审核。<br>
      · <b>已注册</b>：已被注册并生效。<br>
      · <b>已驳回</b>：申请未通过，原申请人可修正后重新申请。<br>
      · <b>已停用</b>：因违规被停用。<br>
      · 持有人邮箱默认脱敏显示，本人与管理员可见完整地址。
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="/js/api.js"></script>
<script>
let rootDomain = '';

async function doQuery() {
  const name = document.getElementById('q').value.trim();
  const box = document.getElementById('result');
  if (!name) { box.style.display = 'none'; return toast('请输入要查询的域名', 'err'); }
  try {
    const r = await api.get('/api/whois?name=' + encodeURIComponent(name));
    const cls = r.available ? 'ok' : r.status === 'pending' ? 'warn' : 'danger';
    const badge = r.available
      ? '<span class="badge ok">可注册</span>'
      : `<span class="badge ${r.status === 'pending' ? 'warn' : 'danger'}">${esc(r.statusText)}</span>`;
    box.style.display = '';
    box.innerHTML = `
      <div class="row between" style="margin-bottom:12px">
        <span class="fqdn">${esc(r.fqdn)}</span>
        ${badge}
      </div>
      <div class="kv">
        <div class="k">查询名称</div><div class="mono">${esc(r.query)}</div>
        <div class="k">状态</div><div>${esc(r.statusText)}</div>
        ${r.exists ? `<div class="k">${r.registeredAt ? '申请时间' : ''}</div><div>${r.registeredAt ? fmtTime(r.registeredAt) : ''}</div>` : ''}
        ${r.exists ? `<div class="k">DNS 记录</div><div>${r.recordCount} 条</div>` : ''}
        ${r.holder ? `<div class="k">持有人</div><div class="mono">${esc(r.holder)}${r.mine ? ' <span class="badge ok">本人</span>' : ''}</div>` : ''}
        ${r.reason ? `<div class="k">原因</div><div>${esc(r.reason)}</div>` : ''}
      </div>
      <div class="alert ${cls}" style="margin:14px 0 0">${esc(r.message)}</div>
      ${r.available ? `
        <div class="hint" style="margin-top:8px;font-family:var(--mono)">
          ${r.unlimited ? '管理员不限积分'
            : `${r.short ? '<b style="color:var(--warn)">单字域名</b> ' : ''}需要 ${r.cost} 分` +
              (r.points === null ? '（登录后可见余额）' : ` · 你的余额 ${r.points} 分${r.enough ? '' : '（不足）'}`)}
        </div>
        <div class="row end" style="margin-top:14px">
          ${isLoggedIn ? `<button class="btn primary" id="goApply"${r.enough || r.unlimited ? '' : ' disabled'}>${r.enough || r.unlimited ? '申请这个域名' : '积分不足'}</button>`
                       : `<a class="btn primary" href="/?q=${encodeURIComponent(r.label)}">登录后申请</a>`}
        </div>` : ''}
      ${r.reclaimable ? '<div class="hint" style="margin-top:8px">这是你此前被驳回的申请，可直接重新提交。</div>' : ''}
    `;
    const btn = document.getElementById('goApply');
    if (btn) btn.onclick = () => location.href = '/dashboard?apply=' + encodeURIComponent(r.label);
  } catch (e) {
    box.style.display = '';
    box.innerHTML = `<div class="alert danger" style="margin:0">${esc(e.message)}</div>`;
  }
}

let isLoggedIn = false;

document.getElementById('btnQuery').onclick = doQuery;
document.getElementById('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') doQuery(); });

(async () => {
  try {
    const cfg = await api.get('/api/config');
    rootDomain = cfg.rootDomain || '';
    document.getElementById('rootSuffix').textContent = '.' + rootDomain;
    document.getElementById('rootTip').textContent = `查询 ${rootDomain} 下二级子域名的注册状态`;
  } catch {}
  try { await api.get('/api/auth/me'); isLoggedIn = true; } catch { isLoggedIn = false; }

  // 支持 /whois.html?name=xxx 或 /whois.html/xxx 直接查询
  let pre = new URLSearchParams(location.search).get('name');
  if (!pre) {
    const seg = location.pathname.split('/').filter(Boolean);
    const last = seg[seg.length - 1] || '';
    // 排除页面自身路径（whois / whois.html），否则访问 /whois 会把 "whois" 当成查询目标
    if (last && !/^whois(\.html)?$/i.test(last)) pre = decodeURIComponent(last);
  }
  if (pre) { document.getElementById('q').value = pre; doQuery(); }

  // 当前处于 whois.<根域名> 时给出提示
  const hp = location.hostname.toLowerCase().split('.');
  if (hp.length >= 3 && hp[0] === 'whois') {
    document.getElementById('hostTip').innerHTML =
      `<span class="badge inf">whois 子域</span> <span style="margin-left:6px">直接访问 ${esc(location.hostname)} 即进入本页；${esc(location.hostname)}/<b>名称</b> 可直接查询。</span>`;
  }
})();

// 免登录页面：未登录也正常渲染（若这里要求登录，会与 whois 子域的自动跳转形成死循环）
mountNav('whois', { optional: true }).then(async (u) => {
  applyBranding(await loadBranding());
  isLoggedIn = !!u;
  // 登录态变化后再刷一次结果，让「申请」按钮状态正确
  const pre = document.getElementById('q').value.trim();
  if (pre) doQuery();
}).catch(() => {});
</script>
</body>
</html>
