<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的子域名 · Meoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Redaction+35:ital,wght@0,400;0,700;1,400&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=LXGW+WenKai+TC:wght@400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Redaction+35:ital,wght@0,400;0,700;1,400&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=LXGW+WenKai+TC:wght@400&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Redaction+35:ital,wght@0,400;0,700;1,400&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=LXGW+WenKai+TC:wght@400&display=swap"></noscript>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="bg"></div>
<header class="topbar" id="topbar"></header>
<aside class="sidebar" id="sidebar"></aside>

<main class="main"><div class="main-in"><div class="wrap">
    <div class="welcome" id="welcome">
    <span class="w-av" id="wAv">M</span>
    <div class="w-txt">
      <div class="w-hi" id="wHi">欢迎回来</div>
      <div class="w-sub" id="wSub">二级域名分发控制台</div>
    </div>
    <div class="row" style="margin-left:auto;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
      <span class="sub" id="quotaTip" style="margin:0"></span>
      <button class="btn sm" id="btnPwd">修改密码</button>
      <a class="btn sm" href="/terms.html" target="_blank">服务条款</a>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat-card sc-pink">
      <span class="sc-ico"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2c1.3 0 2.6 2 3.2 5H8.8C9.4 6 10.7 4 12 4ZM4.3 9h3.1c-.1 1-.2 2.1-.2 3s.1 2 .2 3H4.3a8 8 0 0 1 0-6Zm1.1 8h3.4c.6 3 1.9 5 3.2 5-2.5 0-4.8-2-6.6-5Zm4.6 0h7.9c-1.8 3-4.1 5-6.6 5 1.3 0 2.6-2 3.2-5h-4.5Zm8.6-2c.1-1 .2-2.1.2-3s-.1-2-.2-3h3.1a8 8 0 0 1 0 6h-3.1Z"/></svg></span>
      <div><div class="sc-num" id="stDomains">0</div><div class="sc-lbl">域名总数</div></div>
    </div>
    <div class="stat-card sc-blue">
      <span class="sc-ico"><svg viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 0 1 1 1v4H3V5a1 1 0 0 1 1-1Zm-1 7h18v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-8Zm3 3v2h4v-2H6Z"/></svg></span>
      <div><div class="sc-num" id="stRecords">0</div><div class="sc-lbl">DNS 记录</div></div>
    </div>
    <div class="stat-card sc-green">
      <span class="sc-ico"><svg viewBox="0 0 24 24"><path d="M12 1 3 5v6c0 5.6 3.8 10.7 9 12 5.2-1.3 9-6.4 9-12V5l-9-4Zm0 3.2 7 3.1V11c0 4.4-3 8.3-7 9.4-4-1.1-7-5-7-9.4V7.3l7-3.1Zm-1 5v2H7.5v2H11v2h2v-2h3.5v-2H13v-2h-2Z"/></svg></span>
      <div><div class="sc-num" id="stPoints">0</div><div class="sc-lbl">我的积分</div></div>
    </div>
    <div class="stat-card sc-amber">
      <span class="sc-ico"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5-3 6-3 6h20s-3-1-3-6a7 7 0 0 0-7-7Zm0 2a5 5 0 0 1 5 5c0 2.3.5 3.8 1.3 5H5.7C6.5 12.8 7 11.3 7 9a5 5 0 0 1 5-5Zm-2.2 12h4.4a2.2 2.2 0 0 1-2.2 1.8A2.2 2.2 0 0 1 9.8 16Z"/></svg></span>
      <div><div class="sc-num" id="stPending">0</div><div class="sc-lbl">待审核</div></div>
    </div>
  </div>

  <div class="quick-row">
    <a class="quick" href="#listAnchor" data-quick="list"><span class="q-ico"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4V6Zm0 5h16v2H4v-2Zm0 5h16v2H4v-2Z"/></svg></span><span class="q-txt">我的域名</span></a>
    <a class="quick" href="#applyCard" data-quick="apply"><span class="q-ico"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 5v4h4v2h-4v4h-2v-4H7v-2h4V7h2Z"/></svg></span><span class="q-txt">注册域名</span></a>
    <a class="quick" href="/rewards.html"><span class="q-ico"><svg viewBox="0 0 24 24"><path d="M20 7h-2.2A3 3 0 0 0 12 3.2 3 3 0 0 0 6.2 7H4a1 1 0 0 0-1 1v3h8V8h2v3h8V8a1 1 0 0 0-1-1ZM4 13v7a1 1 0 0 0 1 1h6v-8H4Zm9 8h6a1 1 0 0 0 1-1v-7h-7v8Z"/></svg></span><span class="q-txt">奖励中心</span></a>
    <a class="quick" href="/checkin.html"><span class="q-ico"><svg viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7Zm12 8v9H5v-9h14ZM8 12h3v3H8v-3Z"/></svg></span><span class="q-txt">签到地</span></a>
    <a class="quick" href="/whois.html"><span class="q-ico"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 0 4.9 14.3l4.4 4.4 1.4-1.4-4.4-4.4A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z"/></svg></span><span class="q-txt">WHOIS</span></a>
    <a class="quick" href="/chat.html"><span class="q-ico"><svg viewBox="0 0 24 24"><path d="M4 3h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H8l-4 4V4a1 1 0 0 1 1-1Zm2 4v2h12V7H6Zm0 4v2h9v-2H6Z"/></svg></span><span class="q-txt">聊天地</span></a>
  </div>

<div class="card" id="pointsCard" style="display:none">
    <div class="row between" style="flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-family:var(--display);font-size:26px;line-height:1.1;color:var(--c1)" id="ptVal">0</div>
        <div class="sub" id="ptRules" style="margin:2px 0 0"></div>
      </div>
      <div class="row" style="gap:6px">
        <button class="btn primary" id="btnCheckin">每日签到</button>
        <button class="btn sm ghost" id="btnLogs">明细</button>
      </div>
    </div>
    <div class="hint" id="ptTip" style="margin-top:8px"></div>
  </div>

  <div class="card" id="applyCard">
    <h2>申请子域名</h2>
    <div class="row" style="align-items:flex-end">
      <div style="flex:1;min-width:190px">
        <label>子域名</label>
        <div class="row" style="gap:0;flex-wrap:nowrap">
          <input id="label" placeholder="mail" style="border-radius:var(--radius-s) 0 0 var(--radius-s);border-right:none" autocomplete="off">
          <span class="mono" id="rootWrap" style="padding:0 11px;background:rgba(90,169,230,.12);border:1px solid var(--line);border-radius:0 var(--radius-s) var(--radius-s) 0;display:flex;align-items:center;white-space:nowrap;color:var(--c1);font-size:12px">.<span id="rootDomain"></span></span>
        </div>
        <div class="hint" id="checkTip"></div>
      </div>
      <div style="flex:2;min-width:220px">
        <label>用途说明（选填，供管理员审核参考）</label>
        <input id="note" placeholder="例如：个人博客 / 邮件服务">
      </div>
      <button class="btn primary" id="btnApply">申请</button>
    </div>
    <label class="check" style="margin-top:11px">
      <input type="checkbox" id="agreeUse">
      <span id="agreeUseLabel">我承诺不将域名用于钓鱼、恶意程序、垃圾邮件等违规用途，并已阅读<a href="/terms.html" target="_blank">《服务条款与免责声明》</a>：服务按「现状」提供，不对可用性、数据损失及第三方行为承担责任。</span>
    </label>
    <div class="alert info" style="margin:12px 0 0" id="applyTip">
      创建子域名不会自动写入任何 DNS 记录，审核通过后到「DNS 记录」页按需添加。
    </div>
  </div>

  <div class="card" id="listAnchor">
    <h2>我的域名</h2>
    <div class="row" style="align-items:flex-end;gap:9px;margin-bottom:11px">
      <div style="flex:1;min-width:170px">
        <label>搜索</label>
        <input id="kw" placeholder="域名关键字" autocomplete="off">
      </div>
      <button class="btn" id="btnSearch">搜索</button>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>域名</th><th>状态</th><th>根域名</th><th>记录数</th><th>注册时间</th><th>到期时间</th><th class="right">操作</th></tr></thead>
        <tbody id="list"><tr><td colspan="7" class="empty">加载中…</td></tr></tbody>
      </table>
    </div>
    <div class="row between" style="margin-top:12px">
      <button class="btn sm" id="btnPrev">上一页</button>
      <span class="dim" id="pageTip" style="font-size:12px"></span>
      <button class="btn sm" id="btnNext">下一页</button>
    </div>
  </div>
</div></main>

<div class="modal" id="modal"><div class="box"></div></div>
<div id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script>
let rootDomain = '';
let checkTimer = null;

async function load() {
  const d = await api.get('/api/subdomains');
  const cfg = await api.get('/api/config');
  rootDomain = cfg.rootDomain;
  document.getElementById('rootDomain').textContent = rootDomain;
  const quotaHtml = d.quotaUnlimited ? '<span class="badge inf">∞ 不限</span>' : `${d.quota} 个`;
  const isAdmin = document.querySelector('.navlink[href="/admin"]') !== null;
  let tip = isAdmin
    ? ' · 管理员申请即时开通，可占用保留域名且不限数量'
    : cfg.requireApproval ? ' · 新申请需管理员审核' : ' · 即时生效';
  if (d.rejected > 0) tip += ` · 另有 ${d.rejected} 个被驳回（不占配额）`;
  document.getElementById('quotaTip').innerHTML = `已使用 ${d.used} / ${quotaHtml}` + tip;

  // 单域名队列：已有待审申请则锁住申请入口
  const applyBtn = document.getElementById('btnApply');
  const labelEl = document.getElementById('label');
  const noteEl = document.getElementById('note');
  if (d.pendingApplication && !isAdmin) {
    applyBtn.disabled = true;
    labelEl.disabled = true;
    noteEl.disabled = true;
    applyBtn.textContent = '待审核中';
    document.getElementById('applyTip').innerHTML =
      `<b style="color:var(--warn)">你已有一个待审核的申请：${esc(d.pendingApplication.fqdn)}</b><br>
       同一时间只能申请一个域名，请等待审核结果（或被驳回）后再申请。`;
  } else {
    applyBtn.disabled = false;
    labelEl.disabled = false;
    noteEl.disabled = false;
    applyBtn.textContent = '申请';
  }
  if (isAdmin) {
    document.getElementById('applyTip').innerHTML =
      '创建子域名不会自动写入任何 DNS 记录。<b>管理员特权</b>：申请即时开通、不限数量、可使用 www / mail / admin 等保留域名。';
  } else if (!cfg.requireApproval) {
    document.getElementById('applyTip').innerHTML =
      '创建子域名不会自动写入任何 DNS 记录，开通后到「DNS 记录」页按需添加。';
  }

  allItems = d.items || [];
  renderPage();
  renderStats(d);
  fillWelcome(d);
}

/* ---------- 控制台统计与欢迎条 ---------- */
function renderStats(d) {
  const items = d.items || [];
  const live = items.filter((s) => s.status !== 'rejected');
  const domains = live.length;
  const records = live.reduce((n, s) => n + (Number(s.record_count) || 0), 0);
  const pending = items.filter((s) => s.status === 'pending').length;

  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('stDomains', domains);
  set('stRecords', records);
  set('stPending', pending);

  // 积分（异步，不阻塞）
  api.get('/api/points/me').then((p) => {
    set('stPoints', p.unlimited ? '∞' : p.points);
  }).catch(() => set('stPoints', '—'));

}

/* 欢迎条：自己取当前用户，不依赖骨架返回值（骨架可能先于数据 resolve） */
async function fillWelcome(d) {
  let me = currentUser;
  if (!me || !me.id) {
    try { const r = await api.get('/api/auth/me'); me = (r && r.user) || r || null; currentUser = me; }
    catch { me = null; }
  }
  if (!me) return;

  const items = d.items || [];
  const domains = items.filter((s) => s.status !== 'rejected').length;
  const records = items.filter((s) => s.status !== 'rejected')
    .reduce((n, s) => n + (Number(s.record_count) || 0), 0);

  const nm = String(me.email || '').split('@')[0] || '朋友';
  const av = document.getElementById('wAv');
  const hi = document.getElementById('wHi');
  const sub = document.getElementById('wSub');
  const hour = new Date().getHours();
  const greet = hour < 6 ? '夜深了' : hour < 11 ? '早上好' : hour < 14 ? '中午好' : hour < 18 ? '下午好' : '晚上好';
  if (av) av.textContent = nm.charAt(0).toUpperCase();
  if (hi) hi.textContent = `${greet}，${nm}`;
  if (sub) sub.textContent = [
    me.role === 'admin' ? '管理员' : '普通用户',
    d.quotaUnlimited ? '配额不限' : `配额 ${d.used}/${d.quota}`,
    `${domains} 个域名 · ${records} 条解析`,
  ].join(' · ');
}

let currentUser = null;
const PAGE_SIZE = 10;
let allItems = [];
let curPage = 1;

function filtered() {
  const kw = (document.getElementById('kw')?.value || '').trim().toLowerCase();
  if (!kw) return allItems;
  return allItems.filter((s) =>
    String(s.fqdn || '').toLowerCase().includes(kw) ||
    String(s.note || '').toLowerCase().includes(kw));
}

function renderPage() {
  const tb = document.getElementById('list');
  const items = filtered();
  const totalPage = Math.max(Math.ceil(items.length / PAGE_SIZE), 1);
  if (curPage > totalPage) curPage = totalPage;
  const start = (curPage - 1) * PAGE_SIZE;
  const slice = items.slice(start, start + PAGE_SIZE);

  if (!items.length) {
    tb.innerHTML = `<tr><td colspan="7" class="empty">${allItems.length ? '没有匹配的域名' : '还没有子域名，先在上方申请一个'}</td></tr>`;
    document.getElementById('pageTip').textContent = '';
    return;
  }
  tb.innerHTML = slice.map((s) => {

    const rejected = s.status === 'rejected';
    const note = rejected
      ? `<div class="alert danger" style="margin:6px 0 0;padding:6px 9px;font-size:12px">
           驳回原因：${esc(s.reason || '未说明')}<br>
           <span style="opacity:.85">该域名不占用配额。修正后可释放它再重新申请。</span>
         </div>`
      : s.reason && s.status === 'suspended'
        ? `<div class="hint" style="color:var(--danger)">停用原因：${esc(s.reason)}</div>`
        : s.reason ? `<div class="hint">${esc(s.reason)}</div>` : '';
    const ex = s.expiry || {};
    let expiryHtml = '<span style="color:var(--muted)">—</span>';
    if (s.status === 'approved' || s.status === 'suspended') {
      if (ex.perpetual) expiryHtml = '<span class="badge inf">永久</span>';
      else if (ex.expired) expiryHtml = '<span class="badge danger">已过期</span>';
      else if (ex.canRenew) expiryHtml = `<span class="badge warn">剩 ${ex.daysLeft} 天</span><div class="hint" style="font-size:11px">${fmtDate(ex.expiresAt)} 到期</div>`;
      else expiryHtml = `<span class="badge ok">${ex.daysLeft} 天</span><div class="hint" style="font-size:11px">${fmtDate(ex.expiresAt)} 到期</div>`;
    }
    const canRenew = s.status === 'approved' && ex.canRenew;
    return `
    <tr class="${rejected ? 'rejected' : ''}">
      <td><span class="fqdn"${rejected ? ' style="opacity:.75;text-decoration:line-through"' : ''}>${esc(s.fqdn)}</span>${note}</td>
      <td>${statusBadge(s.status)}${rejected ? '<div class="hint">不占配额</div>' : ''}</td>
      <td class="nowrap" style="color:var(--muted)">.${esc(rootDomain)}</td>
      <td>${s.record_count}</td>
      <td class="nowrap" style="color:var(--muted)">${fmtTime(s.created_at)}</td>
      <td class="nowrap">${expiryHtml}</td>
      <td class="right nowrap">
        ${canRenew ? `<button class="btn sm primary" data-renew="${s.id}">续期</button>` : ''}
        ${rejected ? '' : `<button class="btn sm" onclick="location.href='/domain?id=${s.id}'">DNS 记录</button>`}
        <button class="btn sm ${rejected ? '' : 'danger'}" data-del="${s.id}">${rejected ? '移除' : '释放'}</button>
      </td>
    </tr>`;

  }).join('');

  document.getElementById('pageTip').textContent = `第 ${curPage} / ${totalPage} 页 · 共 ${items.length} 个`;
  document.getElementById('btnPrev').disabled = curPage <= 1;
  document.getElementById('btnNext').disabled = curPage >= totalPage;

  // 续期 / 释放按钮（分页后重新绑定）
  tb.querySelectorAll('[data-renew]').forEach((b) => {
    b.onclick = async () => {
      b.disabled = true;
      try {
        const r = await api.post('/api/subdomains/' + b.dataset.renew + '/renew', {});
        toast(`已续期，新到期 ${fmtDate(r.expiresAt)}`);
        load();
      } catch (e) { toast(e.message, 'err'); b.disabled = false; }
    };
  });
  tb.querySelectorAll('[data-del]').forEach((b) => {
    const s = allItems.find((x) => String(x.id) === String(b.dataset.del));
    const rejected = s && s.status === 'rejected';
    b.onclick = async () => {
      const msg = rejected
        ? '移除这条被驳回的申请？移除后可以重新申请该名称。'
        : '确定释放该子域名？其在 Cloudflare 上的所有 DNS 记录会一并删除。';
      if (!confirm(msg)) return;
      try { await api.del('/api/subdomains/' + b.dataset.del); toast(rejected ? '已移除，可重新申请' : '已释放'); load(); }
      catch (e) { toast(e.message, 'err'); }
    };
  });
}

/* ---------- 多根域名 ---------- */
let ROOTS = [];

function rootQuery() {
  const r = currentRoot();
  return r ? '&root=' + encodeURIComponent(r) : '';
}

function currentRoot() {
  const sel = document.getElementById('rootDomainSel');
  if (sel && sel.value) return sel.value;
  return ROOTS[0] || '';
}

/* 单个根域名：保持原来的静态后缀；多个：换成下拉选择 */
async function setupRoots() {
  try {
    const cfg = await api.get('/api/config');
    const list = Array.isArray(cfg.rootDomains) && cfg.rootDomains.length
      ? cfg.rootDomains
      : (cfg.rootDomain ? [cfg.rootDomain] : []);
    ROOTS = list;
    const wrap = document.getElementById('rootWrap');
    const span = document.getElementById('rootDomain');
    if (!wrap) return;
    if (list.length <= 1) {
      if (span) span.textContent = list[0] || '';
      return;
    }
    // 多根：把静态后缀换成下拉
    wrap.innerHTML = '<span style="opacity:.5">.</span><select id="rootDomainSel" style="border:none;background:transparent;color:var(--c1);font-family:var(--mono);font-size:12px;padding:0 2px;outline:none;cursor:pointer">'
      + list.map((d) => `<option value="${esc(d)}">${esc(d)}</option>`).join('')
      + '</select>';
    const sel = document.getElementById('rootDomainSel');
    sel.onchange = () => {
      const v = document.getElementById('label').value.trim();
      if (v) runCheck(v);
    };
  } catch {}
}

async function runCheck(v) {
  const tip = document.getElementById('checkTip');
  if (!v) { tip.innerHTML = ''; return; }
  try {
    const r = await api.get('/api/subdomains/check?label=' + encodeURIComponent(v) + rootQuery());
    const link = `<a href="/whois.html?name=${encodeURIComponent(v)}" target="_blank" style="font-size:11.5px;margin-left:6px">whois 详情</a>`;
    let costHtml = '';
    if (r.available && r.cost > 0) {
      const okPt = r.enough;
      costHtml = `<div style="margin-top:3px;font-family:var(--mono);font-size:11.5px;color:${okPt ? 'var(--muted)' : 'var(--danger)'}">
        ${r.short ? '<b style="color:var(--warn)">单字域名</b> ' : ''}消耗 ${r.cost} 分 · 余额 ${r.points} 分${okPt ? '' : '（不足，可每日签到积累）'}
      </div>`;
    }
    tip.innerHTML = (r.available
      ? `<span style="color:var(--ok)">${esc(r.fqdn)} 可以注册</span>`
      : `<span style="color:var(--danger)">${esc(r.message)}</span>`) + link + costHtml;
  } catch (err) { tip.innerHTML = ''; }
}

// 本机已同意过免责条款则自动勾选（换设备/清缓存后需重新确认）
try {
  if (localStorage.getItem('meoy_agree_use') === '1') {
    const ag = document.getElementById('agreeUse');
    if (ag) ag.checked = true;
  }
} catch (e) {}

document.getElementById('label').addEventListener('input', (e) => {
  const v = e.target.value.trim();
  const tip = document.getElementById('checkTip');
  if (!v) { tip.innerHTML = ''; return; }
  clearTimeout(checkTimer);
  checkTimer = setTimeout(() => runCheck(v), 350);
});

document.querySelectorAll('[data-quick]').forEach((a) => {
  a.onclick = (e) => {
    const t = a.dataset.quick;
    if (t === 'list') {
      e.preventDefault();
      document.getElementById('listAnchor')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else if (t === 'apply') {
      e.preventDefault();
      document.getElementById('applyCard')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      setTimeout(() => document.getElementById('label')?.focus(), 420);
    }
  };
});

document.getElementById('btnSearch').onclick = () => { curPage = 1; renderPage(); };
document.getElementById('kw').addEventListener('input', () => { curPage = 1; renderPage(); });
document.getElementById('btnPrev').onclick = () => { if (curPage > 1) { curPage--; renderPage(); } };
document.getElementById('btnNext').onclick = () => { curPage++; renderPage(); };

document.getElementById('btnApply').onclick = async () => {
  const label = document.getElementById('label').value.trim();
  const note = document.getElementById('note').value.trim();
  if (!label) return toast('请输入子域名', 'err');
  // 免责确认：勾选后记在本机，下次免勾
  const agree = document.getElementById('agreeUse');
  if (agree && !agree.checked) {
    return toast('请先勾选免责与使用承诺', 'err');
  }
  try {
    localStorage.setItem('meoy_agree_use', '1');
    const r = await api.post('/api/subdomains', { label, note, root: currentRoot() });
    toast(r.status === 'approved' ? '申请成功，已开通' : '已提交，等待管理员审核');
    document.getElementById('label').value = '';
    document.getElementById('note').value = '';
    document.getElementById('checkTip').innerHTML = '';
    load();
    loadPoints();
  } catch (e) {
    toast(e.message, 'err');
    // 名称可能刚被他人抢注，刷新列表并重新检查
    load();
    loadPoints();
    runCheck(label);
  }
};

/* ---------------- 积分 ---------------- */
let ptData = null;

async function loadPoints() {
  try {
    ptData = await api.get('/api/points/me');
  } catch { return; }
  const d = ptData;
  const card = document.getElementById('pointsCard');
  card.style.display = '';
  document.getElementById('ptVal').innerHTML = d.unlimited
    ? '<span style="font-size:26px">∞ 不限</span>'
    : String(d.points);
  document.getElementById('ptRules').textContent = d.unlimited
    ? '管理员不限积分'
    : `签到 +${d.rules.checkin} · 域名 -${d.rules.domainCost} · 单字域名 -${d.rules.shortCost}`;

  const btn = document.getElementById('btnCheckin');
  if (d.unlimited) {
    btn.disabled = true;
    btn.textContent = '管理员不限';
  } else if (d.checkedIn) {
    btn.disabled = true;
    btn.textContent = `今日已签到（${d.today}）`;
  } else {
    btn.disabled = false;
    btn.textContent = `每日签到 +${d.rules.checkin}`;
  }
  const tip = document.getElementById('ptTip');
  tip.textContent = d.unlimited
    ? '管理员申请子域名不消耗积分。'
    : d.checkedIn
      ? `明天可再领 ${d.rules.checkin} 分。单字域名（如 a、1）需 ${d.rules.shortCost} 分兑换。`
      : `今天还没签到，可领 ${d.rules.checkin} 分。单字域名（如 a、1）需 ${d.rules.shortCost} 分兑换。`;
}

document.getElementById('btnCheckin').onclick = async () => {
  const btn = document.getElementById('btnCheckin');
  btn.disabled = true;
  try {
    const r = await api.post('/api/points/checkin', {});
    toast(`签到成功 +${r.gained}，当前 ${r.points} 分`);
    await loadPoints();
  } catch (e) {
    toast(e.message, 'err');
    await loadPoints();
  }
};

document.getElementById('btnLogs').onclick = () => {
  const rows = (ptData && ptData.logs) || [];
  const reasonText = {
    checkin: '每日签到', apply: '申请子域名', grant: '开通额度',
    admin_adjust: '管理员调整', admin_set: '管理员设置',
  };
  openModal('积分明细', rows.length ? `
    <div class="tablewrap"><table>
      <thead><tr><th>变动</th><th>余额</th><th>说明</th><th class="right">时间</th></tr></thead>
      <tbody>${rows.map((l) => `
        <tr>
          <td class="mono" style="color:${l.delta >= 0 ? 'var(--ok)' : 'var(--danger)'}">${l.delta >= 0 ? '+' : ''}${l.delta}</td>
          <td class="mono">${l.balance}</td>
          <td>${esc(reasonText[l.reason] || l.reason)}${l.detail ? ` · ${esc(l.detail)}` : ''}</td>
          <td class="right nowrap" style="color:var(--muted)">${fmtTime(l.created_at)}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>` : '<div class="empty">暂无记录</div>');
};

// 支持从 WHOIS 页带名称跳转过来：/dashboard?apply=xxx
const preApply = new URLSearchParams(location.search).get('apply');
if (preApply) {
  document.getElementById('label').value = preApply;
  runCheck(preApply);
  document.getElementById('note').focus();
}

document.getElementById('btnPwd').onclick = () => {
  openModal('修改密码', `
    <div class="field"><label>原密码</label><input id="op" type="password"></div>
    <div class="field"><label>新密码（至少 8 位）</label><input id="np" type="password"></div>
    <div class="row end"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="okPwd">保存</button></div>`);
  document.getElementById('okPwd').onclick = async () => {
    try {
      await api.post('/api/auth/password', { oldPassword: document.getElementById('op').value, newPassword: document.getElementById('np').value });
      toast('已更新，其它设备已下线'); closeModal();
    } catch (e) { toast(e.message, 'err'); }
  };
};

mountShell('domains').then(async (me) => {
  currentUser = me || null;
  applyBranding(await loadBranding());
  await setupRoots();   // 必须先于 load()，否则查询用的是空 root
  // 从落地页「立即注册」带过来的名称，自动填入并预查
  try {
    const pre = new URLSearchParams(location.search).get('label');
    if (pre) {
      const el = document.getElementById('label');
      if (el) { el.value = pre; runCheck(pre); el.focus(); }
    }
  } catch {}
  load();
  loadPoints();
}).catch(() => {});
</script>
</body>
</html>
