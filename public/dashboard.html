<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的子域名 · Meoy</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="bg"></div>
<nav class="nav" id="nav"></nav>

<div class="wrap">
  <div class="row between" style="margin-bottom:14px">
    <div><h1><span data-site-name>Meoy</span> · 我的子域名</h1><div class="sub" id="quotaTip" style="margin:0"></div></div>
    <div class="row" style="gap:6px">
      <a class="btn sm" href="/terms.html" target="_blank">服务条款</a>
      <button class="btn sm" id="btnPwd">修改密码</button>
    </div>
  </div>

  <div class="card" id="pointsCard" style="display:none">
    <h2>积分</h2>
    <div class="row between" style="flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-family:var(--mono);font-size:28px;line-height:1.1;color:var(--c1)" id="ptVal">0</div>
        <div class="sub" id="ptRules" style="margin:2px 0 0"></div>
      </div>
      <div class="row" style="gap:6px">
        <button class="btn primary" id="btnCheckin">每日签到 +5</button>
        <button class="btn sm ghost" id="btnLogs">明细</button>
      </div>
    </div>
    <div class="hint" id="ptTip" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <h2>申请子域名</h2>
    <div class="row" style="align-items:flex-end">
      <div style="flex:1;min-width:190px">
        <label>子域名</label>
        <div class="row" style="gap:0;flex-wrap:nowrap">
          <input id="label" placeholder="mail" style="border-radius:var(--radius-s) 0 0 var(--radius-s);border-right:none" autocomplete="off">
          <span class="mono" style="padding:0 11px;background:rgba(0,229,255,.08);border:1px solid var(--line);border-radius:0 var(--radius-s) var(--radius-s) 0;display:flex;align-items:center;white-space:nowrap;color:var(--c1);font-size:12px">.<span id="rootDomain"></span></span>
        </div>
        <div class="hint" id="checkTip"></div>
      </div>
      <div style="flex:2;min-width:220px">
        <label>用途说明（选填，供管理员审核参考）</label>
        <input id="note" placeholder="例如：个人博客 / 邮件服务">
      </div>
      <button class="btn primary" id="btnApply">申请</button>
    </div>
    <label class="check" style="margin-top:11px">
      <input type="checkbox" id="agreeUse">
      <span id="agreeUseLabel">我承诺不将域名用于钓鱼、恶意程序、垃圾邮件等违规用途，并已阅读<a href="/terms.html" target="_blank">《服务条款与免责声明》</a>：服务按「现状」提供，不对可用性、数据损失及第三方行为承担责任。</span>
    </label>
    <div class="alert info" style="margin:12px 0 0" id="applyTip">
      创建子域名不会自动写入任何 DNS 记录，审核通过后到「DNS 记录」页按需添加。
    </div>
  </div>

  <div class="card">
    <h2>列表</h2>
    <div class="tablewrap">
      <table>
        <thead><tr><th>域名</th><th>状态</th><th>有效期</th><th>记录数</th><th>申请时间</th><th class="right">操作</th></tr></thead>
        <tbody id="list"><tr><td colspan="6" class="empty">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal" id="modal"><div class="box"></div></div>
<div id="toast"></div>

<script src="/js/api.js"></script>
<script>
let rootDomain = '';
let checkTimer = null;

async function load() {
  const d = await api.get('/api/subdomains');
  const cfg = await api.get('/api/config');
  rootDomain = cfg.rootDomain;
  document.getElementById('rootDomain').textContent = rootDomain;
  const quotaHtml = d.quotaUnlimited ? '<span class="badge inf">∞ 不限</span>' : `${d.quota} 个`;
  const isAdmin = document.querySelector('.navlink[href="/admin"]') !== null;
  let tip = isAdmin
    ? ' · 管理员申请即时开通，可占用保留域名且不限数量'
    : cfg.requireApproval ? ' · 新申请需管理员审核' : ' · 即时生效';
  if (d.rejected > 0) tip += ` · 另有 ${d.rejected} 个被驳回（不占配额）`;
  document.getElementById('quotaTip').innerHTML = `已使用 ${d.used} / ${quotaHtml}` + tip;

  // 单域名队列：已有待审申请则锁住申请入口
  const applyBtn = document.getElementById('btnApply');
  const labelEl = document.getElementById('label');
  const noteEl = document.getElementById('note');
  if (d.pendingApplication && !isAdmin) {
    applyBtn.disabled = true;
    labelEl.disabled = true;
    noteEl.disabled = true;
    applyBtn.textContent = '待审核中';
    document.getElementById('applyTip').innerHTML =
      `<b style="color:var(--warn)">你已有一个待审核的申请：${esc(d.pendingApplication.fqdn)}</b><br>
       同一时间只能申请一个域名，请等待审核结果（或被驳回）后再申请。`;
  } else {
    applyBtn.disabled = false;
    labelEl.disabled = false;
    noteEl.disabled = false;
    applyBtn.textContent = '申请';
  }
  if (isAdmin) {
    document.getElementById('applyTip').innerHTML =
      '创建子域名不会自动写入任何 DNS 记录。<b>管理员特权</b>：申请即时开通、不限数量、可使用 www / mail / admin 等保留域名。';
  } else if (!cfg.requireApproval) {
    document.getElementById('applyTip').innerHTML =
      '创建子域名不会自动写入任何 DNS 记录，开通后到「DNS 记录」页按需添加。';
  }

  const tb = document.getElementById('list');
  if (!d.items.length) {
    tb.innerHTML = `<tr><td colspan="6" class="empty">还没有子域名，先在上方申请一个</td></tr>`;
    return;
  }
  tb.innerHTML = d.items.map((s) => {
    const rejected = s.status === 'rejected';
    const note = rejected
      ? `<div class="alert danger" style="margin:6px 0 0;padding:6px 9px;font-size:12px">
           驳回原因：${esc(s.reason || '未说明')}<br>
           <span style="opacity:.85">该域名不占用配额。修正后可释放它再重新申请。</span>
         </div>`
      : s.reason && s.status === 'suspended'
        ? `<div class="hint" style="color:var(--danger)">停用原因：${esc(s.reason)}</div>`
        : s.reason ? `<div class="hint">${esc(s.reason)}</div>` : '';
    const ex = s.expiry || {};
    let expiryHtml = '<span style="color:var(--muted)">—</span>';
    if (s.status === 'approved' || s.status === 'suspended') {
      if (ex.perpetual) expiryHtml = '<span class="badge inf">永久</span>';
      else if (ex.expired) expiryHtml = '<span class="badge danger">已过期</span>';
      else if (ex.canRenew) expiryHtml = `<span class="badge warn">剩 ${ex.daysLeft} 天</span><div class="hint" style="font-size:11px">${fmtDate(ex.expiresAt)} 到期</div>`;
      else expiryHtml = `<span class="badge ok">${ex.daysLeft} 天</span><div class="hint" style="font-size:11px">${fmtDate(ex.expiresAt)} 到期</div>`;
    }
    const canRenew = s.status === 'approved' && ex.canRenew;
    return `
    <tr class="${rejected ? 'rejected' : ''}">
      <td><span class="fqdn"${rejected ? ' style="opacity:.75;text-decoration:line-through"' : ''}>${esc(s.fqdn)}</span>${note}</td>
      <td>${statusBadge(s.status)}${rejected ? '<div class="hint">不占配额</div>' : ''}</td>
      <td class="nowrap">${expiryHtml}</td>
      <td>${s.record_count}</td>
      <td class="nowrap" style="color:var(--muted)">${fmtTime(s.created_at)}</td>
      <td class="right nowrap">
        ${canRenew ? `<button class="btn sm primary" data-renew="${s.id}">续期</button>` : ''}
        ${rejected ? '' : `<button class="btn sm" onclick="location.href='/domain?id=${s.id}'">DNS 记录</button>`}
        <button class="btn sm ${rejected ? '' : 'danger'}" data-del="${s.id}">${rejected ? '移除' : '释放'}</button>
      </td>
    </tr>`;
  }).join('');
  tb.querySelectorAll('[data-renew]').forEach((b) => {
    b.onclick = async () => {
      b.disabled = true;
      try {
        const r = await api.post('/api/subdomains/' + b.dataset.renew + '/renew', {});
        toast(`已续期，新到期 ${fmtDate(r.expiresAt)}`);
        load();
      } catch (e) { toast(e.message, 'err'); b.disabled = false; }
    };
  });
  tb.querySelectorAll('[data-del]').forEach((b) => {
    const s = d.items.find((x) => String(x.id) === String(b.dataset.del));
    const rejected = s && s.status === 'rejected';
    b.onclick = async () => {
      const msg = rejected
        ? '移除这条被驳回的申请？移除后可以重新申请该名称。'
        : '确定释放该子域名？其在 Cloudflare 上的所有 DNS 记录会一并删除。';
      if (!confirm(msg)) return;
      try { await api.del('/api/subdomains/' + b.dataset.del); toast(rejected ? '已移除，可重新申请' : '已释放'); load(); }
      catch (e) { toast(e.message, 'err'); }
    };
  });
}

async function runCheck(v) {
  const tip = document.getElementById('checkTip');
  if (!v) { tip.innerHTML = ''; return; }
  try {
    const r = await api.get('/api/subdomains/check?label=' + encodeURIComponent(v));
    const link = `<a href="/whois.html?name=${encodeURIComponent(v)}" target="_blank" style="font-size:11.5px;margin-left:6px">whois 详情</a>`;
    let costHtml = '';
    if (r.available && r.cost > 0) {
      const okPt = r.enough;
      costHtml = `<div style="margin-top:3px;font-family:var(--mono);font-size:11.5px;color:${okPt ? 'var(--muted)' : 'var(--danger)'}">
        ${r.short ? '<b style="color:var(--warn)">单字域名</b> ' : ''}消耗 ${r.cost} 分 · 余额 ${r.points} 分${okPt ? '' : '（不足，可每日签到积累）'}
      </div>`;
    }
    tip.innerHTML = (r.available
      ? `<span style="color:var(--ok)">${esc(r.fqdn)} 可以注册</span>`
      : `<span style="color:var(--danger)">${esc(r.message)}</span>`) + link + costHtml;
  } catch (err) { tip.innerHTML = ''; }
}

// 本机已同意过免责条款则自动勾选（换设备/清缓存后需重新确认）
try {
  if (localStorage.getItem('meoy_agree_use') === '1') {
    const ag = document.getElementById('agreeUse');
    if (ag) ag.checked = true;
  }
} catch (e) {}

document.getElementById('label').addEventListener('input', (e) => {
  const v = e.target.value.trim();
  const tip = document.getElementById('checkTip');
  if (!v) { tip.innerHTML = ''; return; }
  clearTimeout(checkTimer);
  checkTimer = setTimeout(() => runCheck(v), 350);
});

document.getElementById('btnApply').onclick = async () => {
  const label = document.getElementById('label').value.trim();
  const note = document.getElementById('note').value.trim();
  if (!label) return toast('请输入子域名', 'err');
  // 免责确认：勾选后记在本机，下次免勾
  const agree = document.getElementById('agreeUse');
  if (agree && !agree.checked) {
    return toast('请先勾选免责与使用承诺', 'err');
  }
  try {
    localStorage.setItem('meoy_agree_use', '1');
    const r = await api.post('/api/subdomains', { label, note });
    toast(r.status === 'approved' ? '申请成功，已开通' : '已提交，等待管理员审核');
    document.getElementById('label').value = '';
    document.getElementById('note').value = '';
    document.getElementById('checkTip').innerHTML = '';
    load();
    loadPoints();
  } catch (e) {
    toast(e.message, 'err');
    // 名称可能刚被他人抢注，刷新列表并重新检查
    load();
    loadPoints();
    runCheck(label);
  }
};

/* ---------------- 积分 ---------------- */
let ptData = null;

async function loadPoints() {
  try {
    ptData = await api.get('/api/points/me');
  } catch { return; }
  const d = ptData;
  const card = document.getElementById('pointsCard');
  card.style.display = '';
  document.getElementById('ptVal').innerHTML = d.unlimited
    ? '<span style="font-size:26px">∞ 不限</span>'
    : String(d.points);
  document.getElementById('ptRules').textContent = d.unlimited
    ? '管理员不限积分'
    : `签到 +${d.rules.checkin} · 域名 -${d.rules.domainCost} · 单字域名 -${d.rules.shortCost}`;

  const btn = document.getElementById('btnCheckin');
  if (d.unlimited) {
    btn.disabled = true;
    btn.textContent = '管理员不限';
  } else if (d.checkedIn) {
    btn.disabled = true;
    btn.textContent = `今日已签到（${d.today}）`;
  } else {
    btn.disabled = false;
    btn.textContent = `每日签到 +${d.rules.checkin}`;
  }
  const tip = document.getElementById('ptTip');
  tip.textContent = d.unlimited
    ? '管理员申请子域名不消耗积分。'
    : d.checkedIn
      ? `明天可再领 ${d.rules.checkin} 分。单字域名（如 a、1）需 ${d.rules.shortCost} 分兑换。`
      : `今天还没签到，可领 ${d.rules.checkin} 分。单字域名（如 a、1）需 ${d.rules.shortCost} 分兑换。`;
}

document.getElementById('btnCheckin').onclick = async () => {
  const btn = document.getElementById('btnCheckin');
  btn.disabled = true;
  try {
    const r = await api.post('/api/points/checkin', {});
    toast(`签到成功 +${r.gained}，当前 ${r.points} 分`);
    await loadPoints();
  } catch (e) {
    toast(e.message, 'err');
    await loadPoints();
  }
};

document.getElementById('btnLogs').onclick = () => {
  const rows = (ptData && ptData.logs) || [];
  const reasonText = {
    checkin: '每日签到', apply: '申请子域名', grant: '开通额度',
    admin_adjust: '管理员调整', admin_set: '管理员设置',
  };
  openModal('积分明细', rows.length ? `
    <div class="tablewrap"><table>
      <thead><tr><th>变动</th><th>余额</th><th>说明</th><th class="right">时间</th></tr></thead>
      <tbody>${rows.map((l) => `
        <tr>
          <td class="mono" style="color:${l.delta >= 0 ? 'var(--ok)' : 'var(--danger)'}">${l.delta >= 0 ? '+' : ''}${l.delta}</td>
          <td class="mono">${l.balance}</td>
          <td>${esc(reasonText[l.reason] || l.reason)}${l.detail ? ` · ${esc(l.detail)}` : ''}</td>
          <td class="right nowrap" style="color:var(--muted)">${fmtTime(l.created_at)}</td>
        </tr>`).join('')}
      </tbody>
    </table></div>` : '<div class="empty">暂无记录</div>');
};

// 支持从 WHOIS 页带名称跳转过来：/dashboard?apply=xxx
const preApply = new URLSearchParams(location.search).get('apply');
if (preApply) {
  document.getElementById('label').value = preApply;
  runCheck(preApply);
  document.getElementById('note').focus();
}

document.getElementById('btnPwd').onclick = () => {
  openModal('修改密码', `
    <div class="field"><label>原密码</label><input id="op" type="password"></div>
    <div class="field"><label>新密码（至少 8 位）</label><input id="np" type="password"></div>
    <div class="row end"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="okPwd">保存</button></div>`);
  document.getElementById('okPwd').onclick = async () => {
    try {
      await api.post('/api/auth/password', { oldPassword: document.getElementById('op').value, newPassword: document.getElementById('np').value });
      toast('已更新，其它设备已下线'); closeModal();
    } catch (e) { toast(e.message, 'err'); }
  };
};

mountNav('dash').then(async () => {
  applyBranding(await loadBranding());
  load();
  loadPoints();
}).catch(() => {});
</script>
</body>
</html>
