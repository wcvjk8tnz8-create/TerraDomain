<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#ffffff">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人资料 · Meoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Redaction+35:ital,wght@0,400;0,700;1,400&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=LXGW+WenKai+TC:wght@400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Redaction+35:ital,wght@0,400;0,700;1,400&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=LXGW+WenKai+TC:wght@400&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Redaction+35:ital,wght@0,400;0,700;1,400&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=LXGW+WenKai+TC:wght@400&display=swap"></noscript>
<link rel="stylesheet" href="/css/style.css">
<script>
/* 主题预置：必须在渲染前同步执行，避免深色模式刷新时白屏闪烁 */
(function(){try{var k='meoy_theme',v=localStorage.getItem(k);
if(v!=='dark'&&v!=='light'){v=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
if(v==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
</script>
</head>
<body>
<div id="bg"></div>
<header class="topbar" id="topbar"></header>
<aside class="sidebar" id="sidebar"></aside>

<main class="main"><div class="main-in"><div class="wrap">
  <h1>个人资料</h1>
  <div class="sub" style="margin:-6px 0 16px">管理你的头像、昵称与账号安全</div>

  <div class="profile-grid">
    <!-- 左：资料卡（参考 DnsNeko：横幅 + 头像 + 等级 + 域名数 + UID） -->
    <div class="card profile-card">
      <div class="pc-banner">
        <img id="pcBanner" src="/img/sakura1.jpg" alt="">
        <div class="pc-banner-mask"></div>
      </div>
      <div class="pc-body">
        <div class="pc-av-wrap">
          <img class="pc-av" id="pcAv" src="/img/avatar/_default.svg" alt="">
          <button class="pc-av-btn" id="btnPickAv" title="更换头像">更换</button>
        </div>
        <div class="pc-name" id="pcName">—</div>
        <div class="pc-tags">
          <span class="badge ok" id="pcState">在线</span>
          <span class="badge inf" id="pcLv">LV 1</span>
          <span class="badge" id="pcDomains">0 Domains</span>
          <span class="badge" id="pcRole">用户</span>
        </div>
        <div class="pc-bio" id="pcBio"></div>
        <div class="kv pc-meta">
          <div class="k">UID</div><div class="mono" id="pcUid">—</div>
          <div class="k">邮箱</div><div class="mono" id="pcMail">—</div>
          <div class="k">注册时间</div><div class="mono" id="pcCreated">—</div>
          <div class="k">最近登录</div><div class="mono" id="pcLogin">—</div>
        </div>
      </div>
    </div>

    <!-- 右：资料编辑 + 安全设置 -->
    <div class="profile-main">
      <div class="card">
        <h2>基本资料</h2>
        <div class="field">
          <label>昵称</label>
          <input id="fNick" maxlength="24" placeholder="给自己起个名字">
        </div>
        <div class="field">
          <label>邮箱</label>
          <input id="fMail" disabled>
          <div class="hint">邮箱即登录账号，暂不支持自助修改。如有需要请联系管理员。</div>
        </div>
        <div class="field">
          <label>头像</label>
          <div class="row" style="gap:9px;align-items:center">
            <img id="fAvPreview" src="/img/avatar/_default.svg" style="width:44px;height:44px;border-radius:50%;border:1px solid var(--line);object-fit:cover">
            <button class="btn sm" id="btnPickAv2">选择头像</button>
            <button class="btn sm" id="btnUploadAv" style="display:none">上传本地图片</button>
            <input type="file" id="fAvFile" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none">
            <span class="hint" style="margin:0">可从内置头像库选择，或在下方填写图片外链</span>
          </div>
          <input id="fAvUrl" placeholder="/img/avatar/pink.svg 或 https://...">
          <div class="hint" id="upTip"></div>
        </div>
        <div class="field">
          <label>个人简介</label>
          <textarea id="fBio" maxlength="160" placeholder="写点什么，会显示在资料卡上"></textarea>
        </div>
        <div class="row end">
          <button class="btn primary" id="btnSave">保存修改</button>
        </div>
      </div>

      <div class="card">
        <h2>安全设置</h2>
        <div class="alert info" style="margin-bottom:12px">
          建议定期更换密码，并妥善保管账号。修改密码后，其它设备上的登录状态会被登出。
        </div>
        <div class="sec-row">
          <div><div class="sec-t">登录密码</div><div class="sec-d">上次修改时间未知</div></div>
          <button class="btn sm" id="btnPwd">修改</button>
        </div>
        <div class="sec-row">
          <div><div class="sec-t">UID</div><div class="sec-d">对外展示用，不含敏感信息</div></div>
          <span class="mono" id="secUid">—</span>
        </div>
        <div class="sec-row">
          <div><div class="sec-t">账号邮箱</div><div class="sec-d" id="secMail">—</div></div>
          <span class="badge">已绑定</span>
        </div>
      </div>
    </div>
  </div>
</div></div></main>

<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>
<div class="toast" id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script>
let me = null, data = null, curAvatar = '/img/avatar/_default.svg';

mountShell('profile').then(async () => {
  applyBranding(await loadBranding());
  await load();
}).catch(() => {});

async function load() {
  try {
    data = await api.get('/api/profile');
  } catch (e) { toast(e.message, 'err'); return; }
  const p = data.profile || {};
  curAvatar = p.avatar || '/img/avatar/_default.svg';
  const nick = p.nickname || String(data.email || '').split('@')[0];

  document.getElementById('pcName').textContent = nick;
  document.getElementById('pcUid').textContent = p.uid || '—';
  document.getElementById('pcMail').textContent = data.email || '—';
  document.getElementById('pcCreated').textContent = fmtTime(data.createdAt);
  document.getElementById('pcLogin').textContent = data.lastLoginAt ? fmtTime(data.lastLoginAt) : '—';
  document.getElementById('pcBio').textContent = p.bio || '';
  document.getElementById('pcDomains').textContent = `${data.domains} Domains`;
  document.getElementById('pcRole').textContent = data.role === 'admin' ? '管理员' : '用户';
  // 等级：按域名数与记录数粗算，纯装饰
  const lv = 1 + Math.floor((data.domains * 3 + data.records) / 2);
  document.getElementById('pcLv').textContent = 'LV ' + lv;
  setAvatar(curAvatar);

  document.getElementById('fNick').value = p.nickname || '';
  document.getElementById('fMail').value = data.email || '';
  document.getElementById('fBio').value = p.bio || '';
  document.getElementById('fAvUrl').value = p.avatar || '';
  document.getElementById('secUid').textContent = p.uid || '—';
  document.getElementById('secMail').textContent = data.email || '—';
}

function setAvatar(url) {
  curAvatar = url || '/img/avatar/_default.svg';
  const av = document.getElementById('pcAv');
  const pv = document.getElementById('fAvPreview');
  if (av) av.src = curAvatar;
  if (pv) pv.src = curAvatar;
  const u = document.getElementById('fAvUrl');
  if (u) u.value = curAvatar;
}

/* ---------- 头像选择弹窗（参考 DnsNeko 的头像库） ---------- */
function openAvatarPicker(afterPick) {
  const list = (data && data.avatars) || [];
  openModal('选择头像', `
    <div class="row" style="justify-content:flex-end;margin-bottom:11px">
      <button class="btn sm" id="btnUploadAv2" style="display:none">上传本地图片</button>
    </div>
    <div class="av-grid">
      ${list.map((a) => `<button class="av-item${a.url === curAvatar ? ' on' : ''}" data-av="${esc(a.url)}">
        <img src="${esc(a.url)}" alt="">
      </button>`).join('')}
    </div>
    <div class="row end" style="margin-top:14px">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" id="okAv">保存修改</button>
    </div>`);
  let picked = curAvatar;
  document.querySelectorAll('.av-item').forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll('.av-item').forEach((x) => x.classList.remove('on'));
      b.classList.add('on');
      picked = b.dataset.av;
    };
  });
  const b2 = document.getElementById('btnUploadAv2');
  if (b2) b2.onclick = () => { closeModal(); pickFile(); };

  document.getElementById('okAv').onclick = () => {
    closeModal();
    if (afterPick) afterPick(picked);
  };
}

document.getElementById('btnPickAv').onclick = () => openAvatarPicker((u) => { setAvatar(u); saveNow(); });
document.getElementById('btnPickAv2').onclick = () => openAvatarPicker((u) => setAvatar(u));

document.getElementById('fAvUrl').addEventListener('change', () => {
  const v = document.getElementById('fAvUrl').value.trim();
  if (v) setAvatar(v);
});

document.getElementById('btnSave').onclick = () => saveNow();


/* ---------- 上传自定义头像（R2） ---------- */
const fileInput = document.getElementById('fAvFile');
const upTip = document.getElementById('upTip');

function pickFile() { fileInput.click(); }
/* 自定义上传默认关闭（当前不绑定 R2）。
   后台在 /api/config 里返回 avatarUpload: true 时才显示并启用。 */
const btnUp = document.getElementById('btnUploadAv');
if (btnUp) btnUp.onclick = pickFile;
try {
  api.get('/api/config').then((cfg) => {
    if (cfg && cfg.avatarUpload === true) {
      [btnUp, document.getElementById('btnUploadAv2')].forEach((b) => { if (b) b.style.display = ''; });
    }
  }).catch(() => {});
} catch (e) {}

fileInput.addEventListener('change', async () => {
  const f = fileInput.files && fileInput.files[0];
  if (!f) return;
  const maxKb = 2048;
  if (f.size > maxKb * 1024) { upTip.textContent = `图片不能超过 ${maxKb} KB`; upTip.style.color = 'var(--danger)'; return; }
  upTip.textContent = '上传中…'; upTip.style.color = '';
  const fd = new FormData();
  fd.append('file', f);
  try {
    // 走原生 fetch：需要 multipart，api.req 会强制 JSON
    const r = await fetch('/api/profile/avatar', { method: 'POST', body: fd, credentials: 'same-origin' });
    const j = await r.json().catch(() => ({}));
    if (!j.success) throw new Error(j.message || '上传失败');
    setAvatar(j.url);
    upTip.textContent = '上传成功，记得点「保存修改」';
    upTip.style.color = 'var(--ok)';
    toast('头像已上传');
  } catch (e) {
    upTip.textContent = e.message;
    upTip.style.color = 'var(--danger)';
  }
  fileInput.value = '';
});

async function saveNow() {
  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  try {
    await api.put('/api/profile', {
      nickname: document.getElementById('fNick').value,
      bio: document.getElementById('fBio').value,
      avatar: document.getElementById('fAvUrl').value.trim() || curAvatar,
    });
    toast('资料已保存');
    await load();
  } catch (e) { toast(e.message, 'err'); }
  btn.disabled = false;
}

/* ---------- 修改密码 ---------- */
document.getElementById('btnPwd').onclick = () => {
  openModal('修改密码', `
    <div class="field"><label>原密码</label><input id="pOld" type="password" autocomplete="current-password"></div>
    <div class="field"><label>新密码（至少 8 位）</label><input id="pNew" type="password" autocomplete="new-password"></div>
    <div class="row end">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" id="okPwd">确认修改</button>
    </div>`);
  document.getElementById('okPwd').onclick = async () => {
    try {
      await api.post('/api/auth/password', {
        oldPassword: document.getElementById('pOld').value,
        newPassword: document.getElementById('pNew').value,
      });
      toast('密码已修改，其它设备已登出');
      closeModal();
    } catch (e) { toast(e.message, 'err'); }
  };
};

/* ---------- 壁纸切换联动资料卡横幅 ---------- */
(function syncBanner() {
  const apply = () => {
    const b = document.getElementById('bg');
    const img = b && getComputedStyle(b).backgroundImage;
    const m = img && img.match(/url\("?([^")]+)"?\)/);
    const el = document.getElementById('pcBanner');
    if (el && m) el.src = m[1];
  };
  setTimeout(apply, 600);
  document.addEventListener('click', (e) => {
    if (e.target.closest?.('.bgswitch button')) setTimeout(apply, 100);
  });
})();
</script>
</body>
</html>
