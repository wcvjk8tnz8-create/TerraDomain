<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服务条款与免责声明 · Meoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Redaction+35:ital,wght@0,400;0,700;1,400&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=LXGW+WenKai+TC:wght@400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Redaction+35:ital,wght@0,400;0,700;1,400&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=LXGW+WenKai+TC:wght@400&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Redaction+35:ital,wght@0,400;0,700;1,400&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=LXGW+WenKai+TC:wght@400&display=swap"></noscript>
<link rel="stylesheet" href="/css/style.css">
<script>
  // 公开页：免登录，接口返回 401 时不跳转登录页
  window.MEOY_PUBLIC_PAGE = true;
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  /* Tailwind 主题：字体沿用 Redaction 35 + 圆体；配色用中性 slate + 单色强调（无渐变） */
  if (typeof tailwind !== 'undefined') {   /* CDN 加载失败时不中断页面其它脚本 */
  tailwind.config = {
    corePlugins: { preflight: false },
    theme: {
      extend: {
        fontFamily: {
          sans: ['Redaction 35', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'sans-serif'],
          mono: ['Redaction 35', 'PingFang SC', 'Microsoft YaHei', 'monospace'],
        },
        borderRadius: { card: '14px' },
        colors: { brand: '#4f46e5' },
      }
    }
  }
  }</script>
</head>
<body>
<div id="bg"></div>
<header class="topbar" id="topbar"></header>
<aside class="sidebar" id="sidebar"></aside>

<main class="main"><div class="main-in"><div class="wrap" style="max-width:820px">
  <div style="margin-bottom:14px">
    <a href="/dashboard" id="backLink" style="font-size:12.5px">返回</a>
  </div>
  <h1>服务条款与免责声明</h1>
  <div class="sub" id="meta"></div>

  <div class="card" id="body">加载中…</div>
</div></main>

<div id="toast"></div>
<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script>
(async () => {
  try {
    await api.get('/api/auth/me');
    document.getElementById('backLink').href = '/dashboard';
    document.getElementById('backLink').textContent = '返回控制台';
  } catch {
    document.getElementById('backLink').href = '/';
    document.getElementById('backLink').textContent = '返回登录';
  }
  try {
    const d = await api.get('/api/terms');
    document.getElementById('meta').textContent = `版本 ${d.version} · 注册即视为同意本条款`;
    let html = '';
    d.sections.forEach((s) => {
      html += `<h3 id="${s.id}">${esc(s.title)}</h3>`;
      (s.blocks || []).forEach((b) => (html += `<p>${esc(b)}</p>`));
      if (s.list) html += `<ul>${s.list.map((li) => `<li>${esc(li)}</li>`).join('')}</ul>`;
      if (s.note) html += `<p><strong>${esc(s.note)}</strong></p>`;
    });
    document.getElementById('body').innerHTML = html;
  } catch (e) {
    document.getElementById('body').innerHTML = '<div class="empty">加载失败</div>';
  }
})();

// 公开页面：未登录也可查看，导航显示登录入口
mountShell('terms', { optional: true }).then(async () => {
  applyBranding(await loadBranding());
}).catch(() => {});
</script>
</body>
</html>
