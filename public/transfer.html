<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#ffffff">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>域名转移 · Meoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Redaction+35:ital,wght@0,400;0,700;1,400&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=LXGW+WenKai+TC:wght@400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Redaction+35:ital,wght@0,400;0,700;1,400&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=LXGW+WenKai+TC:wght@400&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Redaction+35:ital,wght@0,400;0,700;1,400&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&family=LXGW+WenKai+TC:wght@400&display=swap"></noscript>
<link rel="stylesheet" href="/css/style.css">
<script>
/* 主题预置：必须在渲染前同步执行，避免深色模式刷新时白屏闪烁 */
(function(){try{var k='meoy_theme',v=localStorage.getItem(k);
if(v!=='dark'&&v!=='light'){v=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
if(v==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
</script>
</head>
<body>
<div id="bg"></div>
<header class="topbar" id="topbar"></header>
<aside class="sidebar" id="sidebar"></aside>

<main class="main"><div class="main-in"><div class="wrap">
  <h1>域名转移</h1>
  <div class="sub" style="margin:-6px 0 16px">把域名转给本站的另一个账号</div>

  <!-- 四步进度条 -->
  <div class="card">
    <div class="steps" id="steps">
      <div class="step on" data-s="1"><span class="s-num">1</span><span class="s-txt">转移须知</span></div>
      <div class="step" data-s="2"><span class="s-num">2</span><span class="s-txt">域名转移</span></div>
      <div class="step" data-s="3"><span class="s-num">3</span><span class="s-txt">转移确认</span></div>
      <div class="step" data-s="4"><span class="s-num">4</span><span class="s-txt">转移提交</span></div>
    </div>
    <div class="alert warn" style="margin:14px 0">
      <b>域名转移不可逆</b>：转移成功后你失去该域名及全部 DNS 记录的权限，本站无法协助找回。
    </div>
  </div>

  <!-- 第 1 步：须知 -->
  <div class="card pane" id="pane1">
    <h2>转移须知</h2>
    <div class="notice-list" id="noticeList">加载中…</div>
    <div class="field" style="margin-top:14px">
      <label class="check"><input type="checkbox" id="ag1"> 我已阅读并同意转移须知</label>
      <label class="check" style="margin-top:8px"><input type="checkbox" id="ag2"> 我了解转移成功后域名无法找回</label>
    </div>
    <div class="row end"><button class="btn primary" id="next1">下一步</button></div>
  </div>

  <!-- 第 2 步：选择域名与接收账号 -->
  <div class="card pane" id="pane2" style="display:none">
    <h2>域名转移</h2>
    <div class="field">
      <label>选择域名</label>
      <select id="selDom"></select>
      <div class="hint">仅显示你名下<b>已开通</b>的域名。</div>
    </div>
    <div class="field">
      <label>接收账号</label>
      <input id="inpTo" placeholder="对方在本站注册的邮箱">
      <div class="hint" id="chkTip"></div>
    </div>
    <div class="row" style="gap:6px">
      <button class="btn" id="prev2">上一步</button>
      <button class="btn primary" id="next2">下一步</button>
    </div>
  </div>

  <!-- 第 3 步：确认 -->
  <div class="card pane" id="pane3" style="display:none">
    <h2>转移确认</h2>
    <div class="kv" id="confirmBox"></div>
    <div class="field" style="margin-top:12px">
      <label class="check"><input type="checkbox" id="ag3"> 我确认以上信息无误，并知悉转移不可撤销</label>
    </div>
    <div class="row" style="gap:6px">
      <button class="btn" id="prev3">上一步</button>
      <button class="btn primary" id="next3">下一步</button>
    </div>
  </div>

  <!-- 第 4 步：提交 -->
  <div class="card pane" id="pane4" style="display:none">
    <h2>转移提交</h2>
    <div class="alert danger" style="margin-bottom:13px">
      点击下方按钮即完成转移，此操作<b>立即生效且不可撤销</b>。
    </div>
    <div class="kv" id="finalBox"></div>
    <div class="row" style="gap:6px;margin-top:14px">
      <button class="btn" id="prev4">上一步</button>
      <button class="btn danger" id="btnCommit">确认转移</button>
    </div>
  </div>

  <!-- 转移记录 -->
  <div class="card">
    <h2>我的转移记录</h2>
    <div class="tablewrap">
      <table>
        <thead><tr><th>域名</th><th>接收方</th><th>时间</th></tr></thead>
        <tbody id="hisList"><tr><td colspan="3" class="empty">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>
</div></div></main>

<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>
<div class="toast" id="toast"></div>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script>
let step = 1, myDomains = [], preview = null;

mountShell('transfer').then(async () => {
  applyBranding(await loadBranding());
  await Promise.all([loadNotice(), loadDomains(), loadHistory()]);
}).catch((e) => console.error("初始化失败", e));

function goto(n) {
  step = n;
  [1, 2, 3, 4].forEach((i) => {
    document.getElementById('pane' + i).style.display = i === n ? '' : 'none';
    document.querySelectorAll('.step').forEach((s) => {
      const v = Number(s.dataset.s);
      s.classList.toggle('on', v === n);
      s.classList.toggle('done', v < n);
    });
  });
}

async function loadNotice() {
  try {
    const d = await api.get('/api/transfer/notice');
    document.getElementById('noticeList').innerHTML =
      `<ol>${d.lines.map((l) => `<li>${esc(l)}</li>`).join('')}</ol>`;
  } catch { document.getElementById('noticeList').textContent = '须知加载失败，请刷新重试。'; }
}

async function loadDomains() {
  try {
    const d = await api.get('/api/subdomains');
    myDomains = (d.items || []).filter((x) => x.status === 'approved');
  } catch { myDomains = []; }
  const sel = document.getElementById('selDom');
  sel.innerHTML = myDomains.length
    ? myDomains.map((x) => `<option value="${x.id}">${esc(x.fqdn)}</option>`).join('')
    : '<option value="">（无可转移的域名）</option>';
}

async function loadHistory() {
  const tb = document.getElementById('hisList');
  try {
    const d = await api.get('/api/transfer/mine');
    const items = d.items || [];
    if (!items.length) { tb.innerHTML = `<tr><td colspan="3" class="empty">暂无转移记录</td></tr>`; return; }
    tb.innerHTML = items.map((t) => `
      <tr>
        <td class="fqdn">${esc(t.fqdn)}</td>
        <td style="color:var(--muted)">${esc(t.to_email)}</td>
        <td class="nowrap" style="color:var(--muted)">${fmtTime(t.created_at)}</td>
      </tr>`).join('');
  } catch { tb.innerHTML = `<tr><td colspan="3" class="empty">加载失败</td></tr>`; }
}

/* ---------- 第 1 步 ---------- */
document.getElementById('next1').onclick = () => {
  if (!document.getElementById('ag1').checked || !document.getElementById('ag2').checked) {
    return toast('请先勾选两个确认项', 'err');
  }
  goto(2);
};

/* ---------- 第 2 步 ---------- */
document.getElementById('prev2').onclick = () => goto(1);
document.getElementById('next2').onclick = async () => {
  const sid = Number(document.getElementById('selDom').value);
  const to = document.getElementById('inpTo').value.trim();
  if (!sid) return toast('请选择要转移的域名', 'err');
  if (!to) return toast('请填写接收账号邮箱', 'err');
  const tip = document.getElementById('chkTip');
  tip.textContent = '校验中…';
  try {
    const d = await api.post('/api/transfer/preview', { subdomainId: sid, toEmail: to });
    preview = d;
    tip.textContent = '';
    const box = document.getElementById('confirmBox');
    box.innerHTML = `
      <div class="k">转移域名</div><div class="mono">${esc(d.fqdn)}</div>
      <div class="k">接收账号</div><div class="mono">${esc(d.toEmail)}</div>
      <div class="k">DNS 记录</div><div>${d.recordCount} 条（一并转移）</div>`;
    document.getElementById('finalBox').innerHTML = box.innerHTML;
    goto(3);
  } catch (e) { tip.textContent = e.message; tip.style.color = 'var(--danger)'; }
};

/* ---------- 第 3 步 ---------- */
document.getElementById('prev3').onclick = () => goto(2);
document.getElementById('next3').onclick = () => {
  if (!document.getElementById('ag3').checked) return toast('请勾选确认项', 'err');
  goto(4);
};

/* ---------- 第 4 步 ---------- */
document.getElementById('prev4').onclick = () => goto(3);
document.getElementById('btnCommit').onclick = async () => {
  const btn = document.getElementById('btnCommit');
  if (!preview) return toast('信息已失效，请重新操作', 'err');
  if (!confirm(`确定将 ${preview.fqdn} 转移给 ${preview.toEmail}？此操作不可撤销。`)) return;
  btn.disabled = true;
  try {
    await api.post('/api/transfer/commit', {
      subdomainId: preview.subdomainId,
      toEmail: preview.toEmail,
      agreed: true,
    });
    toast(`已转移给 ${preview.toEmail}`);
    preview = null;
    await Promise.all([loadDomains(), loadHistory()]);
    [1, 2, 3, 4].forEach((i) => { if (i === 3 || i === 4) document.getElementById('ag' + i) && (document.getElementById('ag' + i).checked = false); });
    goto(1);
    document.getElementById('ag1').checked = false;
    document.getElementById('ag2').checked = false;
  } catch (e) { toast(e.message, 'err'); }
  btn.disabled = false;
};
</script>
</body>
</html>
