name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # ══════════════════════════════════════════════════════════
    #  Token 说明：CLOUDFLARE_API_TOKEN 与 CF_API_TOKEN 二选一
    #   - 只填 CLOUDFLARE_API_TOKEN → 部署和 DNS 都用这个
    #   - 只填 CF_API_TOKEN        → 部署和 DNS 都用这个
    #   - 两个都填                 → 各用各的（可给不同最小权限）
    #  下面这行做统一取值，后面所有步骤共用
    # ══════════════════════════════════════════════════════════
    env:
      CF_AUTH_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 不启用 npm 缓存选项：该选项要求仓库里存在 package-lock.json；
          # 本项目不提交 lock（沙盒镜像无法生成），改用 npm install。

      # 仓库不跟踪 package-lock.json，因此不能用 npm ci（会因缺 lock 直接失败）。
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # 校验必需配置是否齐全，缺什么直接说清楚
      - name: 检查配置
        run: |
          miss=0
          [ -z "$CF_AUTH_TOKEN" ] && { echo "✘ 缺少 API Token：请在 Secrets 里填 CLOUDFLARE_API_TOKEN 或 CF_API_TOKEN（二选一）"; miss=1; }
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && { echo "✘ 缺少 CLOUDFLARE_ACCOUNT_ID（Cloudflare 账户 ID）"; miss=1; }
          [ -z "$CF_ZONE_ID" ] && { echo "✘ 缺少 CF_ZONE_ID（根域名的 Zone ID）"; miss=1; }
          if [ "$miss" = "1" ]; then
            echo ""
            echo "设置入口：仓库 Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CF_API_TOKEN }}" ]; then
            echo "✓ 两个 Token 都已配置，部署用 CLOUDFLARE_API_TOKEN、DNS 用 CF_API_TOKEN"
          else
            echo "✓ 已配置单个 Token，部署与 DNS 共用"
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}

      # 类型检查：存量 .js 不参与检查（tsconfig checkJs=false），
      # 只对 .ts 生效。当前为非阻断，纯提示；稳定后可去掉 continue-on-error。
      - name: 类型检查（TypeScript）
        continue-on-error: true
        run: npm run typecheck

      # 构建 React 前端（产物 dist/client，由 wrangler [assets] 托管）
      - name: 构建前端（Vite）
        run: npm run build

      # D1 数据库：存在就复用，不存在自动创建，并把 uuid 传给下一步
      - name: 准备 D1 数据库
        run: node scripts/ensure-d1.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_AUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}

      # R2 存储桶：存在就复用，不存在自动创建（用于自定义头像上传）
      # 头像默认走 Worker 的 /api/avatar/<key> 代理，本身即公网可访问，不需要 R2 公开访问
      # 如需外链直连，可在 Variables 里填 R2_CUSTOM_DOMAIN（如 img.meoy.top）
      # 注意：用 always() 放行 —— R2 准备失败时脚本会自动移除绑定并降级，
      # 站点功能不受影响（仅上传自定义头像不可用），不应阻断部署。
      - name: 准备 R2 存储桶
        continue-on-error: true
        run: node scripts/ensure-r2.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_AUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROOT_DOMAINS: ${{ vars.ROOT_DOMAINS }}
          CF_ZONE_IDS: ${{ vars.CF_ZONE_IDS }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_CUSTOM_DOMAIN: ${{ vars.R2_CUSTOM_DOMAIN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}

      # 把 Variables 写进 wrangler.toml
      # database_id 由上一步自动写入环境，此处不再覆盖
      - name: 注入配置
        run: node scripts/inject-config.mjs
        env:
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          DEFAULT_QUOTA: ${{ vars.DEFAULT_QUOTA }}
          ALLOW_SIGNUP: ${{ vars.ALLOW_SIGNUP }}
          REQUIRE_APPROVAL: ${{ vars.REQUIRE_APPROVAL }}
          RESERVED_LABELS: ${{ vars.RESERVED_LABELS }}
          CF_MOCK: ${{ vars.CF_MOCK }}
          ROOT_DOMAINS: ${{ vars.ROOT_DOMAINS }}
          CF_ZONE_IDS: ${{ vars.CF_ZONE_IDS }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          AVATAR_MAX_KB: ${{ vars.AVATAR_MAX_KB }}

      # 敏感值写入 Worker 的加密环境变量（等同 wrangler secret put）
      # DNSHE_API_KEY / DNSHE_API_SECRET 为可选项：不填则退回公开模式
      - name: 写入 Worker Secrets
        run: |
          set -e
          printf '%s' "$CF_API_TOKEN" | npx wrangler secret put CF_API_TOKEN >/dev/null
          printf '%s' "$CF_ZONE_ID"   | npx wrangler secret put CF_ZONE_ID   >/dev/null
          echo "✓ 已写入 CF_API_TOKEN、CF_ZONE_ID"
          if [ -n "$DNSHE_API_KEY" ] && [ -n "$DNSHE_API_SECRET" ]; then
            printf '%s' "$DNSHE_API_KEY"    | npx wrangler secret put DNSHE_API_KEY    >/dev/null
            printf '%s' "$DNSHE_API_SECRET" | npx wrangler secret put DNSHE_API_SECRET >/dev/null
            echo "✓ 已写入 DNSHE_API_KEY、DNSHE_API_SECRET（DNSHE 域名查询走认证模式）"
          else
            echo "• 未配置 DNSHE 凭证，DNSHE 域名查询走公开模式（2 次/分钟/IP）"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_AUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ env.CF_AUTH_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          DNSHE_API_KEY: ${{ secrets.DNSHE_API_KEY }}
          DNSHE_API_SECRET: ${{ secrets.DNSHE_API_SECRET }}

      # 建表（幂等：CREATE TABLE IF NOT EXISTS，重复部署不会丢数据）
      - name: 初始化 D1 表结构
        run: npx wrangler d1 execute "${D1_DATABASE_NAME}" --remote --file=./schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_AUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME || 'subdomain-hub-db' }}

      - name: 部署 Worker（含静态资源）
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_AUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
